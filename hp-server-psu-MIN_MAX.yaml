        }
        return NAN;
      }
      if (count > 0 && id(allow_error_recovery)) {
        count--;
      }
      auto x = (rec & 0X00FFFF);
      return x; // No Scaling
      
  - platform: template
    name: "Intake Air Temp"
    id: temp1
    accuracy_decimals: 1
    state_class: measurement
    device_class: temperature
    unit_of_measurement: °C
    update_interval: 1s
    filters:
      - sliding_window_moving_average:
          window_size: 15
