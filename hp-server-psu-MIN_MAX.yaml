      return x/254.5; // Scale by 254.5 (Default of 255, adjusted to match multimeter)
    on_value:
      then:
        - lambda: |-
            const float threshold_v = 10.0; // <--- Adjust your threshold here
            static bool was_off = true;
            float current_v = x;

            if (std::isnan(current_v)) return;

            if (current_v > threshold_v) {
              if (was_off) {
                was_off = false;
                id(delayed_clear_records).stop();
                id(session_age_minutes) = 0; 
                id(session_timer).execute();
                id(v_out_min).publish_state(current_v);
                id(v_out_max).publish_state(current_v);
                id(reset_countdown_seconds) = id(default_countdown_seconds); 
              }
              if (std::isnan(id(v_out_min).state) || current_v < id(v_out_min).state) {
                id(v_out_min).publish_state(current_v);
              }
              if (std::isnan(id(v_out_max).state) || current_v > id(v_out_max).state) {
               id(v_out_max).publish_state(current_v);
              }
            } 
            else {
              if (!was_off) {
                was_off = true;
                id(session_timer).stop();
                id(delayed_clear_records).execute();
              }
            }

