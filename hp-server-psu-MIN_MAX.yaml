      uint8_t cs = 0;
      cs += ((rec & 0xFF0000) >> 16);
      cs += ((rec & 0xFF00) >> 8);
      cs += (rec & 0xFF);
      cs = ((0xFF - cs) + 1) & 0xFF;
      if (cs != 0) {
        ESP_LOGE("HP_PSU", "[%s] Mismatch checksum. addr: 0x%02x, chk: 0x%02x", sensor_name, dataAddr, cs);
