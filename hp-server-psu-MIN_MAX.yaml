      }
      if (count > 0 && id(allow_error_recovery)) {
        count--;
      }
      auto x = (rec & 0X00FFFF);
      return x/64.0; // Scale by 64

  - platform: template
    name: "Internal PSU Temp"
    id: temp2
    accuracy_decimals: 1
    state_class: measurement
    device_class: temperature
    unit_of_measurement: °C
    update_interval: 1s
    filters:
      - sliding_window_moving_average:
