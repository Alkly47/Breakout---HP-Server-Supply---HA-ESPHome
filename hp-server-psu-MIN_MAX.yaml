number:
  - platform: template
    id: min_rpm
    name: "Minimum Fan RPM"
    min_value: 1500
    max_value: 18000
    step: 500
    set_action:
      - lambda: !lambda |-
          uint16_t data = (uint16_t)x;
          uint8_t dataAddr = 0x40;
          uint8_t valLSB = data & 0xFF;
          uint8_t valMSB = (data >> 8) & 0xFF;
          uint8_t cs = (id(addr_psu) << 1) + dataAddr + valLSB + valMSB;
          uint8_t regCS = ((0xFF - cs) + 1) & 0xff;
          std::vector<uint8_t> data_payload = {valLSB, valMSB, regCS};
          if (id(psu_dev).write_bytes(dataAddr, data_payload)) {
            ESP_LOGD("number", "Successfully wrote minimum RPM value %d to PSU", data);
            id(min_rpm).publish_state(x);
            id(min_rpm_old_value) = id(min_rpm).state;
          } else {
            ESP_LOGE("number", "Failed to write minimum RPM value %d to PSU. Reverting state.", data);
            // On failure, revert to the old value by publishing it directly
            id(min_rpm).publish_state(id(min_rpm_old_value));
          }

