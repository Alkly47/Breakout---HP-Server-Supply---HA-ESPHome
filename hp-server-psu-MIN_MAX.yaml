      if (!id(psu_dev).write_byte(dataAddr, regCS) || !id(psu_dev).read_bytes_raw(buffer, 3)) {
        ESP_LOGE("HP_PSU", "[%s] I2C communication failed!", sensor_name);
        if (++count > limit) {
          device_failed = true;
          ESP_LOGE("HP_PSU", "[%s] Repeat Errors: fail_limit reached. Disabling I2C attempts.", sensor_name);
        }
        return NAN;
      }
