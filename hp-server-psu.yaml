        }
        return NAN;
      }
      if (count > 0 && id(allow_error_recovery)) {
        count--;
      }
      auto x = (rec & 0X00FFFF);
      return x; // No Scaling
      
  - platform: template
    name: "Intake Air Temp"
    id: temp1
