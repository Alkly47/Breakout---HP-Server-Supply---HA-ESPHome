  ## PSU loss points: delta between input and output power/energy (efficiency monitoring).
  - platform: template
    name: "PSU Loss"
    id: psu_loss
    accuracy_decimals: 1
    state_class: measurement
    device_class: power
    unit_of_measurement: W
    update_interval: 1s
    filters:
      - or:
        - delta: 1
        - throttle: 30s
    lambda: "return id(power_in).state - id(power_out).state;"

  - platform: template
    name: "PSU Loss Percent"
    id: psu_loss_percent
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: "%"
    update_interval: 1s
    filters:
      - or:
        - delta: 0.5
        - throttle: 30s
    lambda: !lambda |-
      float pin = id(power_in).state;
      float pout = id(power_out).state;
      if (isnan(pin) || isnan(pout) || pin <= 0.0f) {
        return NAN;
      }
      return (pin - pout) / pin * 100.0f;

  - platform: template
    name: "Total Daily Energy Loss"
    id: daily_energy_loss
    accuracy_decimals: 3
    state_class: total_increasing
    device_class: energy
    unit_of_measurement: kWh
    update_interval: 1s
    filters:
      - or:
        - delta: 0.001
        - throttle: 30s
    lambda: "return id(daily_energy_in).state - id(daily_energy_out).state;"

number:
  - platform: template
    id: min_rpm
    name: "Minimum Fan RPM"
    min_value: 1500
    max_value: 18000
    step: 500
    set_action:
      - lambda: !lambda |-
          uint16_t data = (uint16_t)x;
          uint8_t dataAddr = 0x40;
          uint8_t valLSB = data & 0xFF;
          uint8_t valMSB = (data >> 8) & 0xFF;
          uint8_t cs = (id(addr_psu) << 1) + dataAddr + valLSB + valMSB;
          uint8_t regCS = ((0xFF - cs) + 1) & 0xff;
          std::vector<uint8_t> data_payload = {valLSB, valMSB, regCS};
          if (id(psu_dev).write_bytes(dataAddr, data_payload)) {
            ESP_LOGD("number", "Successfully wrote minimum RPM value %d to PSU", data);
            id(min_rpm).publish_state(x);
            id(min_rpm_old_value) = id(min_rpm).state;
          } else {
            ESP_LOGE("number", "Failed to write minimum RPM value %d to PSU. Reverting state.", data);
            // On failure, revert to the old value by publishing it directly
            id(min_rpm).publish_state(id(min_rpm_old_value));
          }

