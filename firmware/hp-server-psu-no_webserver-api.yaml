      cs += ((rec & 0xFF0000) >> 16);
      cs += ((rec & 0xFF00) >> 8);
      cs += (rec & 0xFF);
      cs = ((0xFF - cs) + 1) & 0xFF;
      if (cs != 0) {
        ESP_LOGE("CSPS", "Mismatch checksum. addr: 0x%02x, chk: 0x%02x", dataAddr, cs);
       return 0; // Return 0 on checksum error
      }
      auto x = (rec & 0X00FFFF);
      return x; // No Scaling
      
