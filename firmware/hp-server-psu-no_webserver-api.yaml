number:
  - platform: template
    id: min_rpm
    name: "Minimum Fan RPM"
    optimistic: true
    min_value: 1500
    max_value: 18000
    step: 500
    on_value:
      then:
        - lambda: !lambda |-
            uint16_t data = (id(min_rpm).state); 
            uint8_t dataAddr = 0x40;
            uint8_t valLSB = data & 0xFF;
            uint8_t valMSB = (data >> 8) & 0xFF;
            uint8_t cs = (id(addr_psu) << 1) + dataAddr + valLSB + valMSB;
            uint8_t regCS = ((0xFF - cs) + 1) & 0xff;
            std::vector<uint8_t> data_payload = {valLSB, valMSB, regCS};
            id(psu_dev).write_bytes(dataAddr, data_payload);

text_sensor:
  - platform: wifi_info
    ip_address: 
      name: esp-IP
      id: esp_IP
    mac_address: 
      name: esp-MAC
      id: esp_MAC
    ssid: 
      name: esp-SSID
      id: esp_SSID

  - platform: template
    name: "Spare Part Number"
    update_interval: 24h
    lambda: !lambda |-
      uint8_t data[10];
      if (id(psu_rom).read_bytes(0x12, data, 10)) {
        return {std::string((char*)data, 10)};
      }
      return {};
  - platform: template
    name: "Date Code"
    update_interval: 24h
    lambda: !lambda |-
      uint8_t data[8];
      if (id(psu_rom).read_bytes(0x1D, data, 8)) {
        return {std::string((char*)data, 8)};
      }
      return {};
  - platform: template
    name: "Manufacturer"
    update_interval: 24h
    lambda: !lambda |-
      uint8_t data[5];
      if (id(psu_rom).read_bytes(0x2C, data, 5)) {
        return {std::string((char*)data, 5)};
      }
      return {};
  - platform: template
    name: "PSU Name"
    update_interval: 24h
    lambda: !lambda |-
      uint8_t data[26];
      if (id(psu_rom).read_bytes(0x32, data, 26)) {
        return {std::string((char*)data, 26)};
      }
      return {};
  - platform: template
    name: "Option Kit Number"
    update_interval: 24h
    lambda: !lambda |-
      uint8_t data[10];
      if (id(psu_rom).read_bytes(0x4D, data, 10)) {
