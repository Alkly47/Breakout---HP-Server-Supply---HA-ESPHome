esphome:
  name: hp-server-psu
  friendly_name: HP Server PSU
    
esp8266:
  board: d1_mini

logger:

api:

ota:
  platform: esphome
  password: ""

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret net_domain
  ap:
    password: "123456789"

captive_portal:
  id: my_portal
improv_serial:
# web_server:
#   port: 80
#   log: false
#   version: 2

switch:
  - platform: restart
    name: "Reboot ESP"

status_led:
  pin:
    number: D4
    inverted: true

i2c:
  - frequency: 100kHz ## 200kHz seems to be maximum, sort-of stable, bus speed for the PSU, but results in occasional corrupt data; faster results in complete bus lockup and esp crash. 100kHz is the recommended frequency in my testing.

## Declare generic i2c devices to access PSU
i2c_device:
  - id: psu_dev
    address: 0x5f
  - id: psu_rom
    address: 0x57

ads1115:
  - address: 0x48

font:
  - file: "gfonts://Roboto"
    id: body_font
    size: 12
    bpp: 4

  - file: "gfonts://Roboto"
    id: header_font
    size: 15
    bpp: 8
    
interval:
  - interval: 5s
    then:
      - display.page.show_next: oled_display
      - component.update: oled_display

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    id: oled_display
    address: 0x3C
    update_interval: .5s
    pages: 
      - id: page1
        lambda: |-
          it.print(0, 0, id(header_font), "AC INPUT");
          it.printf(0, 20, id(body_font), "Voltage:   %.3f V", id(voltage_in).state);
          it.printf(0, 34, id(body_font), "Current:   %.2f A", id(current_in).state);
          it.printf(0, 48, id(body_font), "Power:   %.1f W", id(power_in).state);
      - id: page2
        lambda: |-
          it.print(0, 0, id(header_font), "DC OUTPUT");
          it.printf(0, 20, id(body_font), "Voltage:   %.3f V", id(voltage_out).state);
          it.printf(0, 34, id(body_font), "Current:   %.2f A", id(current_out).state);
          it.printf(0, 48, id(body_font), "Power:   %.1f W", id(power_out).state);
      - id: page3
        lambda: |-
          it.print(0, 0, id(header_font), "THERMALS");
          it.printf(0, 20, id(body_font), "Intake Temp:   %.2f° C", id(temp1).state);
          it.printf(0, 34, id(body_font), "PSU Temp:   %.2f° C", id(temp2).state);
          it.printf(0, 48, id(body_font), "Fan:   %.0f rpm", id(fan_speed).state);
      - id: page4
        lambda: |-
          it.print(0, 0, id(header_font), "ADS1115");
          it.printf(0, 20, id(body_font), "DC Out:  %.1fV", id(ads_12v_main_voltage).state);
          it.printf(88, 20, id(body_font), ": %.1fA", id(ads_12v_main_current).state);
          it.printf(0, 34, id(body_font), "12v STBY:  %.3fV", id(ads_12v_stby_voltage).state);
          it.printf(0, 48, id(body_font), "5v STBY:  %.3fV", id(ads_5v_stby_voltage).state);
      - id: page5
        lambda: |-
          it.printf(0, 0, id(header_font), "PEAK AMPS OUT");
          it.printf(0, 30, id(header_font), "%.3fA", id(peak_amps_out).state);
      - id: page6
        lambda: |-
          std::string dev_Name = App.get_name();
          if (id(my_portal).is_active()) {
            it.print(0, 0, id(header_font), "HOTSPOT ACTIVE");
            it.printf(0, 20, id(body_font), "SSID:  %s", dev_Name.c_str());
            it.print(0, 34, id(body_font), "PASS:  123456789");
            it.printf(0, 48, id(body_font), "- %s -", id(esp_MAC).state.c_str());
            }
          else {
            it.printf(0, 0, id(header_font), "WIFI         %.0f dbm", id(esp_signal).state);
            it.printf(0, 20, id(body_font), "IP:  %s", id(esp_IP).state.c_str());
            it.printf(0, 34, id(body_font), "SSID:  %s", id(esp_SSID).state.c_str());
            it.printf(0, 48, id(body_font), "- %s -", id(esp_MAC).state.c_str());
          }

globals: ## Must exist for use within sensor lambdas
  - id: addr_psu
    type: int
    restore_value: no
    initial_value: "0x5f"
  - id: addr_rom
    type: int
    restore_value: no
    initial_value: "0x57"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal Sensor"
    id: esp_signal
    update_interval: 30s

  - platform: ads1115
    id: ads_12v_main_current
    device_class: current
    multiplexer: 'A0_GND'
    gain: 4.096
    name: "12v Main Current"
    filters:
        - multiply: 26.25   ## (26.25mV / Amp)
        - delta: 0.005
    unit_of_measurement: "A"
    update_interval: 1s  
  
  - platform: ads1115
    id: ads_12v_main_voltage
    device_class: voltage
    multiplexer: 'A1_GND'
    gain: 4.096
    name: "12v Main Voltage"
    filters:
        - multiply: 3.75
        - delta: 0.1        
    unit_of_measurement: "V"
    update_interval: 5s
  
  - platform: ads1115
    id: ads_12v_stby_voltage
    device_class: voltage
    multiplexer: 'A2_GND'
    gain: 4.096
    name: "12v STBY Voltage"
    filters:
        - multiply: 3.75
        - delta: 0.1
    unit_of_measurement: "V"
    update_interval: 5s
  
  - platform: ads1115
    id: ads_5v_stby_voltage
    device_class: voltage
    multiplexer: 'A3_GND'
    gain: 4.096
    name: "5v STBY Voltage"
    filters:
        - multiply: 1.666667
        - delta: 0.1
    unit_of_measurement: "V"
    update_interval: 5s

  - platform: template
    name: "Peak Amps Out"
    id: peak_amps_out
    accuracy_decimals: 1
    device_class: current
    unit_of_measurement: A
    update_interval: 10s
    filters:
      - delta: 0.1
    lambda: !lambda |-
      uint32_t rec = 0xFFFF;
      uint8_t dataAddr = 0x36;
      uint8_t regCS = ((0xFF - (dataAddr + (id(addr_psu) << 1))) + 1) & 0xFF;
      uint8_t buffer[3];         
      id(psu_dev).write_byte(dataAddr, regCS);
      id(psu_dev).read_bytes_raw (buffer, 3);
      rec = buffer[0];
      rec |= buffer[1] << 8;
      rec |= buffer[2] << 16;
      uint8_t cs = 0;
      cs += ((rec & 0xFF0000) >> 16);
      cs += ((rec & 0xFF00) >> 8);
      cs += (rec & 0xFF);
      cs = ((0xFF - cs) + 1) & 0xFF;
      if (cs != 0) {
        ESP_LOGE("CSPS", "Mismatch checksum. addr: 0x%02x, chk: 0x%02x", dataAddr, cs);
       return 0; // Return 0 on checksum error
      }
      auto x = (rec & 0x00FFFF);
      return x/64.0; // Scale the value by 64

