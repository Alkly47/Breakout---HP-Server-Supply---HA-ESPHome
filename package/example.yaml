esphome:
  name: hp-psu ##Change as desired
  name_add_mac_suffix: True ## Add mac_suffix to ensure unique name
  friendly_name: HP Server PSU ##Change as desired
  
esp8266:
  board: d1_mini

logger:

api: ##Enable Home Assistant API
    
ota:
  platform: esphome
  password: ""

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  ap:
    password: "123456789"

captive_portal:
  id: my_portal
improv_serial:
web_server:
  port: 80
  log: false
  version: 2

switch:
  - platform: restart
    name: "Reboot ESP"

button:
  - platform: safe_mode
    name: "Restart ESP (Safe Mode)"

i2c:
  - frequency: 50kHz ## 200kHz seems to be maximum, sort-of stable, bus speed for the PSU, but results in occasional corrupt data; faster results in complete bus lockup and esp crash. 100kHz is the recommended max frequency. 50hkz is default for compatibility

## Comment out if not using homeassistant API, to avoid endless blinking blue LED
status_led:
  pin:
    number: D4
    inverted: true
##

packages:
  # shorthand form github://username/repository/[folder/]file-path.yml[@branch-or-tag]
  remote_package_shorthand: github://Alkly47/Breakout---HP-Server-Supply---HA-ESPHome/package/PackageHPPSUMinMax.yaml@packages-Testing
